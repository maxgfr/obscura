[package]
name = "obscura-cli"
version = "1.2.0"
edition = "2021"
rust-version = "1.85"
description = "Companion CLI for obscura: open sealed recordings, inspect and repair them, build studio links."
license = "MIT"
repository = "https://github.com/maxgfr/obscura"
publish = false

[[bin]]
name = "obscura"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
getrandom = "0.3"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
